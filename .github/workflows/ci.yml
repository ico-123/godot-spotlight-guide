name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  godot-smoke-test:
    name: Godot 4.7.2 smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 unzip

      - name: Download Godot
        run: |
          curl --fail --location --silent --show-error \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Run smoke test
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path . \
            --script res://tests/smoke_test.gd
